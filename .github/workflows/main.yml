name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-tauri:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Fix NPM Optional Dependencies Bug & Install
        # We delete the Linux-generated package-lock.json and force the 
        # installation of the missing Windows Rollup MSVC module.
        run: |
          Remove-Item -ErrorAction Ignore package-lock.json
          npm install
          npm install -f @rollup/rollup-win32-x64-msvc
        shell: pwsh

      - name: Build Tauri Executable
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Tauri action automatically runs the build scripts and wraps them in an .exe
          args: --target x86_64-pc-windows-msvc
