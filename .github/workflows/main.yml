name: Build and Release Tauri App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies & Fix Rollup
        run: |
          npm install
          npm install -D @rollup/rollup-win32-x64-msvc

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: "v__VERSION__" 
          releaseName: "SAW AI Workspace v__VERSION__"
          releaseBody: "Release of SAW AI Workspace. See the assets below to download the .exe file."
          releaseDraft: false
          prerelease: false
          args: "--target x86_64-pc-windows-msvc"
