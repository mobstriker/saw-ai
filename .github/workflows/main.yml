name: Build Windows App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Fix Windows Optional Dependencies
        # This deletes the Linux-created package-lock so npm can properly download the Windows-specific binaries for Rollup and LightningCSS.
        run: |
          if (Test-Path package-lock.json) { Remove-Item package-lock.json -Force }
          if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }
          npm install
          npm install @rollup/rollup-win32-x64-msvc lightningcss-win32-x64-msvc --no-save
        shell: powershell

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'SAW AI Workspace v__VERSION__'
          releaseBody: 'Here is the latest Windows release.'
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
