[package]
name = "saw-ai-workspace"
version = "2.4.0"
description = "Sandboxed AI Workspace"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri Rust crates. The exact resolved versions are pinned in Cargo.lock
# (tauri 2.11.1, tauri-plugin-fs 2.5.1, tauri-plugin-http 2.5.9) and MUST stay
# in major.minor lockstep with the npm packages in package.json
# (@tauri-apps/api ^2.11.1, plugin-fs ^2.5.1, plugin-http ^2.5.9) — Tauri v2
# aborts `tauri build` with a version-mismatch error if they drift.
# tauri-plugin-http ^2.5 requires tauri ^2.10, so the whole set is on
# 2.10+/2.5.x together. The npm ranges all resolve to exactly the locked Rust
# versions (each is the current latest in its minor line), which keeps the
# match stable even when CI reinstalls without the lockfile.
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-http = { version = "2.5", features = ["unsafe-headers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Sandbox command runner (Feature 3): scoped process execution with a live
# stdout/stderr stream back to the webview. tokio drives the async process and
# the per-line reader; globlite is a tiny zero-dep glob helper used to collect
# build artifacts (dist/**, *.exe, *.apk, build/app/outputs/**).
tokio = { version = "1", features = ["process", "io-util", "rt", "sync", "macros", "time"] }
glob = "0.3"
